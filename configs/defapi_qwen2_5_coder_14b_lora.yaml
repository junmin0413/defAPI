model_name: Qwen/Qwen2.5-Coder-14B-Instruct
dataset_name: hitoshura25/crossvul
dataset_split: train
eval_split:
output_dir: /workspace/checkpoints/defapi-qwen2.5-coder-14b-lora

max_seq_length: 2048
attn_implementation: sdpa
gradient_checkpointing: false
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

learning_rate: 2.0e-4
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
save_steps: 200
eval_steps: 200
logging_steps: 10
save_total_limit: 2

report_to: wandb
wandb_project: defapi-finetuning
wandb_run_name: qwen2.5-coder-14b-lora-full
seed: 42

smoke_training:
  dataset_split: train[:100]
  output_dir: /workspace/checkpoints/defapi-qwen2.5-coder-14b-lora-smoke
  max_seq_length: 1024
  gradient_accumulation_steps: 4
  save_steps: 20
  eval_steps: 20
  logging_steps: 1
  num_train_epochs: 1
  report_to: none
