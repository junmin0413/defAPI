model_name: Qwen/Qwen2.5-Coder-14B-Instruct
dataset_name: hitoshura25/crossvul
dataset_split: train
dataset_path:
eval_dataset_path:
output_dir: /workspace/checkpoints/defapi-qwen2.5-coder-14b-qlora

max_seq_length: 2048
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05

learning_rate: 2.0e-4
num_train_epochs: 1
batch_size: 1
gradient_accumulation_steps: 16
save_steps: 100
eval_steps: 100
logging_steps: 10
save_total_limit: 3

bf16: true
fp16: false
gradient_checkpointing: true
optim: paged_adamw_8bit
warmup_ratio: 0.03
weight_decay: 0.0
max_grad_norm: 0.3
lr_scheduler_type: cosine

wandb_project: defapi-finetuning
wandb_run_name: qwen2.5-coder-14b-qlora
report_to: wandb

seed: 42
eval_split_size: 0.1
resume_from_checkpoint:
device_map: auto
trust_remote_code: true
packing: false
